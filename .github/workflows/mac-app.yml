name: Build Mac app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: _mac-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Sign (ad-hoc), zip and make disk images
        run: |
          set -euo pipefail
          APP="Noam's Game Hub.app"
          cd dist
          for dir in mac-arm64 mac; do
            arch=$([ "$dir" = mac ] && echo x64 || echo arm64)
            codesign --force --deep --sign - "$dir/$APP"
            codesign --verify --deep "$dir/$APP"
            ditto -c -k --keepParent "$dir/$APP" "NoamsGameHub-mac-$arch.zip"
            mkdir -p "dmg-$arch"
            cp -R "$dir/$APP" "dmg-$arch/"
            ln -s /Applications "dmg-$arch/Applications"
            hdiutil create -volname "Noam's Game Hub" -srcfolder "dmg-$arch" -ov -format UDZO "NoamsGameHub-mac-$arch.dmg"
          done
          ls -la *.zip *.dmg
      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: "Noam's Game Hub for Mac ${{ steps.ver.outputs.v }}"
          make_latest: true
          body: |
            Noam's Game Hub as a Mac app. Download page: https://noamtoder.com/app
            - Apple Silicon (M1/M2/M3/M4…): NoamsGameHub-mac-arm64.dmg
            - Intel Macs: NoamsGameHub-mac-x64.dmg
          files: |
            _mac-app/dist/NoamsGameHub-mac-*.zip
            _mac-app/dist/NoamsGameHub-mac-*.dmg
