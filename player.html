<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Player · Noam's Game Hub</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d1a; --bg-2: #12152b; --card: #171b36; --card-hover: #1e2347; --line: #2a3060;
            --text: #eef0ff; --muted: #9aa0c8; --accent: #7c5cff; --accent-2: #2ee6c9; --hot: #ff4d8d; --gold: #ffc94d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif; color: var(--text); min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.25), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(46,230,201,.15), transparent 60%), var(--bg);
        }
        .hidden { display: none !important; }
        .navbar {
            position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; padding: 14px clamp(16px, 4vw, 48px);
            background: rgba(11,13,26,.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .logo { font-family: 'Press Start 2P', monospace; font-size: 14px; text-decoration: none; color: var(--text); }
        .logo span { color: var(--accent-2); }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--line); background: var(--bg-2); color: var(--text);
            border-radius: 10px; padding: 9px 14px; font: 600 14px 'Inter', sans-serif; cursor: pointer; text-decoration: none;
            transition: background .2s, border-color .2s;
        }
        .btn:hover { background: var(--card-hover); border-color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .nav-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        main { max-width: 1100px; margin: 0 auto; padding: 36px clamp(16px, 4vw, 48px) 64px; }

        .hero {
            display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
            background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(46,230,201,.10));
            border: 1px solid var(--line); border-radius: 22px; padding: clamp(22px, 4vw, 36px); margin-bottom: 24px;
        }
        .avatar {
            width: 92px; height: 92px; border-radius: 24px; flex: none; overflow: hidden;
            display: grid; place-items: center; font-size: 38px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 0 5px rgba(124,92,255,.18);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .who { flex: 1; min-width: 220px; }
        .name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; }
        .edit { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
        .edit:hover { color: var(--text); }
        .name-form { display: flex; gap: 8px; flex-wrap: wrap; }
        .name-form input {
            background: var(--bg-2); border: 1px solid var(--accent); border-radius: 10px;
            padding: 9px 12px; color: var(--text); font: 600 18px 'Inter', sans-serif; outline: none; min-width: 0; width: 220px;
        }
        .meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
        .pills { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .pill { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }
        .pill.premium { background: rgba(255,201,77,.15); color: var(--gold); border: 1px solid rgba(255,201,77,.35); }
        .pill.free { background: rgba(154,160,200,.12); color: var(--muted); border: 1px solid var(--line); }
        .pill.admin { background: rgba(255,77,141,.15); color: var(--hot); border: 1px solid rgba(255,77,141,.35); }

        .upsell {
            display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
            border: 1px dashed rgba(255,201,77,.5); background: rgba(255,201,77,.06);
            border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; color: var(--muted); font-size: 14px;
        }
        .upsell strong { color: var(--gold); }
        .noamlink { border-color: rgba(124,92,255,.55); background: rgba(124,92,255,.08); }
        .noamlink strong { color: #cfc4ff; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 32px; }
        .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
        .stat .num { font-size: 28px; font-weight: 800; }
        .stat .lbl { color: var(--muted); font-size: 13px; font-weight: 600; }

        h2 { font-size: 22px; font-weight: 800; margin-bottom: 16px; }
        .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        .game {
            display: flex; gap: 14px; align-items: center; text-decoration: none; color: var(--text);
            background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
            transition: transform .2s, border-color .2s, background .2s;
        }
        .game:hover { transform: translateY(-3px); border-color: var(--accent); background: var(--card-hover); }
        .game.locked { opacity: .55; }
        .thumb { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex: none; background: linear-gradient(135deg, #2a2160, #123a4a); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .g-name { font-weight: 800; }
        .g-name .lock { color: var(--gold); font-size: 13px; margin-left: 4px; }
        .g-best { font-size: 14px; color: var(--accent-2); font-weight: 700; margin-top: 2px; }
        .g-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .g-none { font-size: 13px; color: var(--muted); margin-top: 2px; }

        .levelbox { min-width: 200px; text-align: center; }
        .lvl small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1px; font-weight: 800; }
        .lvl b { font-family: 'Press Start 2P', monospace; font-size: 34px; color: var(--accent-2); }
        .xpbar { height: 10px; background: var(--bg-2); border-radius: 6px; overflow: hidden; margin: 10px 0 6px; border: 1px solid var(--line); }
        .xpbar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s; }
        .xptext { font-size: 12px; color: var(--muted); font-weight: 700; }
        .nameerr { margin-top: 10px; color: #ff8db4; font-weight: 700; font-size: 14px; }
        .daily { background: var(--card); border: 1px solid #ffc94d66; border-radius: 16px; padding: 16px 20px; margin-bottom: 24px;
                 display: flex; justify-content: space-between; gap: 14px; align-items: center; flex-wrap: wrap; }
        .daily b { color: var(--gold); } .daily p { color: var(--muted); font-size: 14px; margin-top: 4px; }
        h2 small { color: var(--muted); font-size: 14px; font-weight: 600; }
        .prem-tag { color: var(--gold) !important; }
        .ach { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        .badge { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
        .badge .ic { font-size: 26px; width: 40px; text-align: center; }
        .badge b { display: block; font-size: 14px; } .badge span { color: var(--muted); font-size: 12px; }
        .badge.off { opacity: .4; filter: grayscale(1); }
        .badge.on { border-color: var(--accent-2); }
        .style-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 18px; }
        .style-card h3 { font-size: 15px; margin-bottom: 10px; }
        .frames, .skinrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .skinrow { margin-bottom: 10px; } .skinrow .lab { width: 120px; color: var(--muted); font-size: 14px; font-weight: 700; }
        .fr { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; cursor: pointer;
              display: grid; place-items: center; color: #fff; font-weight: 800; position: relative; margin: 0 6px; }
        .fr small { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); white-space: nowrap; }
        .frames { padding-bottom: 18px; }
        .fr.sel, .sw.sel { outline: 3px solid #fff; outline-offset: 3px; }
        .sw { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #ffffff33; cursor: pointer; }
        .style-card.locked .frames, .style-card.locked #skins { opacity: .45; pointer-events: none; }
        .lockmsg a { color: var(--gold); font-weight: 700; }
        .loading { text-align: center; color: var(--muted); padding: 20vh 16px; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card); border: 1px solid var(--accent); padding: 12px 18px; border-radius: 12px;
            font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
    
        .avatar.emoji { font-size: 52px; }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; }
        .bdg { display: inline-flex; gap: 6px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
        .empty { color: var(--muted); text-align: center; padding: 18vh 16px; font-size: 18px; }
        .empty b { display: block; font-size: 54px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="logo" href="/">Noam's <span>Game Hub</span></a>
        <div class="nav-actions">
            <a class="btn" href="/">🎮 Games</a>
            <a class="btn" href="/leaderboard">🏆 Leaderboards</a>
            <a class="btn" href="/profile" id="meLink">👤 My profile</a>
        </div>
    </nav>

    <div class="loading" id="loading">Loading player…</div>
    <div class="empty hidden" id="empty"><b>🕵️</b><span id="emptyText">We couldn't find that player.</span></div>

    <main class="hidden" id="main">
        <section class="hero">
            <div class="avatar" id="avatar">?</div>
            <div class="who">
                <div class="name-row"><h1 id="name" data-noi18n>Player</h1></div>
                <div class="meta" id="since"></div>
                <div class="pills" id="pills"></div>
            </div>
            <div class="levelbox">
                <div class="lvl"><small>LEVEL</small><b id="lvl">1</b></div>
                <div class="xptext" id="xpText"></div>
            </div>
        </section>

        <section class="stats">
            <div class="stat"><div class="num" id="sGames">0</div><div class="lbl">Games played</div></div>
            <div class="stat"><div class="num" id="sAch">0</div><div class="lbl">Achievements</div></div>
            <div class="stat"><div class="num" id="sWins">0</div><div class="lbl">Online wins</div></div>
        </section>

        <h2>🏅 Achievements</h2>
        <div class="badges" id="ach"></div>

        <h2 style="margin-top:32px">🎮 Favourite games</h2>
        <div class="grid" id="games"></div>
    </main>

    <script type="module">
        import { ready, state, GAMES } from "/hub.js";
        import { getPlayer } from "/social.js";
        import { ACHIEVEMENTS, FRAMES } from "/progress.js";
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const uid = new URLSearchParams(location.search).get("u") || "";
        await ready;
        $("meLink").classList.toggle("hidden", !state.user);
        let p = null;
        try { if (/^[A-Za-z0-9_-]{1,128}$/.test(uid)) p = await getPlayer(uid); } catch (e) {}
        $("loading").classList.add("hidden");
        if (!p) { $("empty").classList.remove("hidden"); }
        else if (p.private) {
            $("emptyText").textContent = "This player keeps their profile private.";
            $("empty").querySelector("b").textContent = "🔒";
            $("empty").classList.remove("hidden");
        } else {
            document.title = `${p.name} · Noam's Game Hub`;
            $("name").textContent = p.name + (p.premium ? " ★" : "");
            if (p.premium) $("name").style.color = "var(--gold)";
            const av = $("avatar");
            if (p.avatar) { av.textContent = p.avatar; av.classList.add("emoji"); } else av.textContent = (p.name || "?").charAt(0).toUpperCase();
            const f = FRAMES[p.frame || "none"];
            if (f && (!f.premium || p.premium)) av.style.cssText = f.css;
            const since = p.since?.toDate ? p.since.toDate().toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : null;
            $("since").textContent = since ? `Member since ${since}` : "";
            $("pills").innerHTML = p.premium ? '<span class="pill premium">★ Premium</span>' : "";
            $("lvl").textContent = p.level || 1;
            $("xpText").textContent = `${(p.xp || 0).toLocaleString()} XP`;
            const have = new Set(p.ach || []);
            const list = ACHIEVEMENTS.filter((a) => have.has(a.id));
            $("sGames").textContent = p.played || 0;
            $("sAch").textContent = list.length;
            $("sWins").textContent = p.onlineWins || 0;
            $("ach").innerHTML = list.length ? list.map((a) => `<span class="bdg" title="${esc(a.desc)}">${a.icon} <span>${esc(a.name)}</span></span>`).join("")
                : '<p style="color:var(--muted)">No achievements yet.</p>';
            const top = (p.top || []).filter((t) => GAMES[t.id]);
            $("games").innerHTML = top.length ? top.map((t) => `<a class="game" href="${esc(GAMES[t.id].path)}">
                <div class="thumb"><img src="${esc(GAMES[t.id].img)}" alt="" loading="lazy" onerror="this.remove()"></div>
                <div><div class="g-name">${esc(GAMES[t.id].name)}</div>${t.best ? `<div class="g-best">🏆 Best: ${t.best.toLocaleString()}</div>` : ""}
                <div class="g-sub">${t.plays} play${t.plays === 1 ? "" : "s"}</div></div></a>`).join("")
                : '<p style="color:var(--muted)">No games played yet.</p>';
            $("main").classList.remove("hidden");
        }
    </script>
    <script type="module" src="/hub.js"></script>
</body>
</html>
